; SENSMOS nRF52840 port — Seeed XIAO nRF52840 + Wio-SX1262, LoRa-only transport
; (no WiFi hardware). Based on Galusz/sensmos-firmware (ESP32-S3) + the esp8266 port's
; recipes (micro-ecc crypto, PrefsStore persistence, cooperative tick loop).
;
; Board defs come from Seeed's own platform (official platformio/nordicnrf52 has no XIAO
; entry). Adafruit nRF5 core, SoftDevice S140 v7.3.0 linked (app RAM budget 232KB).
; Upload = adafruit-nrfutil serial DFU with 1200bps touch (auto-enters bootloader; the
; CDC port re-enumerates during DFU — wait_for_upload_port in the board def handles it).
[env:xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
upload_port = COM15
build_flags =
    -DFW_IS_NRF52840
    -DSENSMOS_LORA_ONLY
    -DLORA_ENABLED=1
lib_deps =
    jgromes/RadioLib@^7.2.1
    bblanchon/ArduinoJson@^7.0.0
    kmackay/micro-ecc@^1.0.0
    rweather/Crypto@^0.4.0

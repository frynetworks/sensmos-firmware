; SENSMOS ESP8266 port — based on Galusz/sensmos-firmware (ESP32)
[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
; 160 MHz: nie zmienia mapy RAM, ale skraca okna szczytowej alokacji (TLS/JSON/crypto)
; — mniej zdarzen fragmentacji przy tym samym heapie.
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
; WEBSOCKETS_MAX_DATA_SIZE: library default is 15KB/frame on ESP8266 — a single oversized
; inbound frame allocation would OOM a node idling at ~5KB free. Our protocol bounds every
; frame far lower for data (s_enc 1568B sealed) — but the plaintext `identified` catalog
; measured 3686B on 2026-08-18 (45 rich entity objects), so 4KB is the floor; 2KB broke
; the handshake. WEBSOCKETS_SAVE_RAM: naglowki WS do flasha (-476B RAM).
; MMU: 16KB icache + 48KB IRAM z drugim heapem (SECHEAP_SHARED). Kod .text1 = ~28KB,
; wiec ~19KB IRAM zostaje jako drugi heap na bulk-bufory (HeapSelectIram w net_worker/
; tunnel). Koszt: polowa icache — mierzone gate'em, brak regresji stabilnosci.
build_flags = -DFW_IS_ESP8266 -DWEBSOCKETS_MAX_DATA_SIZE=4096 -DWEBSOCKETS_SAVE_RAM -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
lib_deps =
    links2004/WebSockets@^2.7.3
    bblanchon/ArduinoJson@^7.0.0
    kmackay/micro-ecc@^1.0.0

; Debug-only env: adds the flag-gated WiFi deep diagnostics (config.h WIFI_DEEP_DIAG).
; Build/flash with `pio run -e nodemcuv2_diag ...`. The shipping env (nodemcuv2) stays clean.
[env:nodemcuv2_diag]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -DWIFI_DEEP_DIAG=1

; wolfSSL TLS PoC env — build/flash with `pio run -e nodemcuv2_tls ...`. Separate from the
; shipping env so the default nodemcuv2 build carries zero TLS code or heap footprint.
; SENSMOS_USE_TLS gates esp8266/src/ws_tls.cpp. wolfSSL's own config comes from
; tools/patch_wolfssl_settings.py (pre-build hook), NOT from -D flags here: the
; wolfssl/wolfssl PlatformIO package's settings.h auto-defines WOLFSSL_USER_SETTINGS and
; quoted-#include "user_settings.h" itself, which always resolves to the package's own
; bundled ESP-IDF/ESP32-oriented example (found first on the include path) — -D flags on
; the compile line cannot override a #define inside that file. See README.md
; "TLS Upgrade Path" for what this measures.
[env:nodemcuv2_tls]
extends = env:nodemcuv2
; relocate_wolfssl_rodata: wolfSSL wnosi ~26KB .rodata; na 8266 .rodata siedzi w DRAM,
; więc obraz TLS linkował się, ale zostawiał ~1.2KB heapu na boot → SDK OOM przed setup()
; (reset-loop). Skrypt patchuje WYGENEROWANY ld (build/ld/), przenosząc .rodata wolfSSL-a
; do irom0.text — non32xfer handler (aktywny: MMU_IRAM_HEAP) obsługuje odczyty 8/16-bit.
extra_scripts =
    pre:tools/patch_wolfssl_settings.py
    post:tools/relocate_wolfssl_rodata.py
build_flags = ${env:nodemcuv2.build_flags} -DSENSMOS_USE_TLS -DWOLFSSL_USER_SETTINGS
lib_deps =
    ${env:nodemcuv2.lib_deps}
    wolfssl/wolfssl@^5.7.2
